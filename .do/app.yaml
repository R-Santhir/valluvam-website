# DigitalOcean App Platform configuration
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: valluvam-website

services:
  - name: web
    github:
      repo: r-santhir/valluvam-website
      branch: main
      deploy_on_push: true

    # Step 1: install dependencies, then build the static site into _site/
    build_command: npm install && node build.js

    # Step 2: start the Express server which serves _site/
    run_command: node server.js

    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080

    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
