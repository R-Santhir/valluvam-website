name: valluvam-website

static_sites:
  - name: web
    github:
      repo: r-santhir/valluvam-website
      branch: main
      deploy_on_push: true
    build_command: npm install && node build.js
    output_dir: public
    index_document: index.html
    error_document: 404.html
    routes:
      - path: /
